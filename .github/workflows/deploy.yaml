name: Deploy to GitHub Pages

on:
  push:
    branches: [hovud]
  schedule:
    # Rebuild daily so the baseline stays fresh even without a push
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Last.fm API key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          sed -i "s/__LASTFM_API_KEY__/${LASTFM_API_KEY}/g" index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'