name: markescence

services:
  markescence:
    build: .
    restart: unless-stopped
    ports:
      - "4002:4001"
    volumes:
      - ./db:/app/db
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
