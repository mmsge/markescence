name: markescence

services:
  markescence:
    build: .
    restart: unless-stopped
    ports:
      - "4002:4001"
    volumes:
      - ./db:/app/db
    env_file: .env
    healthcheck:
      # /healthz, never /health: liveness only. /health reports "degraded" for a
      # slow Last.fm poll, and a healthcheck wired to it would restart-loop the
      # container over an upstream hiccup (hetzner-server ADR 0022).
      # 127.0.0.1, not localhost: it must not depend on DNS/IPv6 resolution
      # inside the container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
