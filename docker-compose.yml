name: markescence

services:
  markescence:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    # Cap the container log: json-file never rotates on its own, and 10m x 3 is also how much output survives an outage of the central log collector (naustet-server ADR 0032).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4002:4001"
    volumes:
      - ./db:/app/db
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
